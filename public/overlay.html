<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoV Overlay</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div id="stage">

    <!-- ===================== SCOREBOARD ===================== -->
    <section id="sb" class="sb" aria-label="scoreboard">
      <div class="sb-side sb-left" data-side="left">
        <div class="sb-anim">
          <div class="sb-panel">
            <div class="sb-flash"></div>
            <div class="sb-stripe"></div>
            <div class="sb-logo" data-mono="left"></div>
            <div class="sb-tag" data-text="left.tag">SKT</div>
            <div class="sb-dots" data-dots="left"></div>
          </div>
          <div class="sb-sub"><span data-text="roundName"></span></div>
        </div>
      </div>
      <div class="sb-side sb-right" data-side="right">
        <div class="sb-anim">
          <div class="sb-panel">
            <div class="sb-flash"></div>
            <div class="sb-dots" data-dots="right"></div>
            <div class="sb-tag" data-text="right.tag">CSN</div>
            <div class="sb-logo" data-mono="right"></div>
            <div class="sb-stripe"></div>
          </div>
          <div class="sb-sub"><span>GAME <b data-text="gameNumber">1</b></span><i class="sb-sep"></i><span data-text="boLabel">BO3</span></div>
        </div>
      </div>
    </section>

    <!-- ===================== STARTING ===================== -->
    <section class="scene scene-starting" data-scene="starting">
      <div class="bg-stripes"></div>
      <div class="corner-chip a-drop"><span data-text="eventName"></span></div>
      <div class="st-center">
        <div class="st-title a-rise">STARTING SOON</div>
        <div class="st-sub a-rise d1">การแข่งขันกำลังจะเริ่มในอีก</div>
        <div class="clock-box a-pop d2"><span class="clock" data-clock></span></div>
      </div>
      <div class="st-bottom a-up d3">
        <div class="mini-team mini-l"><div class="mini-mono" data-mono="left"></div><span data-text="left.tag"></span></div>
        <div class="mini-vs">VS</div>
        <div class="mini-team mini-r"><span data-text="right.tag"></span><div class="mini-mono" data-mono="right"></div></div>
        <div class="mini-round" data-text="roundName"></div>
      </div>
    </section>

    <!-- ===================== MATCHUP ===================== -->
    <section class="scene scene-matchup" data-scene="matchup">
      <div class="mu-half mu-l">
        <div class="mu-content">
          <div class="mu-mono a-pop d2" data-mono="left" data-variant="on-color"></div>
          <div class="mu-tag a-slide-l d3" data-text="left.tag"></div>
          <div class="mu-name a-slide-l d4" data-text="left.name"></div>
        </div>
      </div>
      <div class="mu-half mu-r">
        <div class="mu-content">
          <div class="mu-mono a-pop d2" data-mono="right" data-variant="on-color"></div>
          <div class="mu-tag a-slide-r d3" data-text="right.tag"></div>
          <div class="mu-name a-slide-r d4" data-text="right.name"></div>
        </div>
      </div>
      <div class="mu-seam"></div>
      <div class="mu-vs a-vs"><span>VS</span></div>
      <div class="mu-info a-up d5">
        <span data-text="roundName"></span><i class="sep"></i><span>GAME <b data-text="gameNumber"></b></span><i class="sep"></i><span data-text="boLabel"></span>
      </div>
      <div class="corner-chip a-drop"><span data-text="eventName"></span></div>
    </section>

    <!-- ===================== BREAK ===================== -->
    <section class="scene scene-break" data-scene="break">
      <div class="bg-stripes"></div>
      <div class="corner-chip a-drop"><span data-text="eventName"></span></div>
      <div class="br-head">
        <div class="br-title a-rise">พักเบรก</div>
        <div class="br-sub a-rise d1">BREAK · <span data-text="roundName"></span></div>
      </div>
      <div class="br-score">
        <div class="br-team br-l a-slide-l d2">
          <div class="br-mono" data-mono="left"></div>
          <div class="br-id"><div class="br-tag" data-text="left.tag"></div><div class="br-name" data-text="left.name"></div></div>
          <div class="br-num" data-text="left.score"></div>
        </div>
        <div class="br-dash a-pop d3">:</div>
        <div class="br-team br-r a-slide-r d2">
          <div class="br-num" data-text="right.score"></div>
          <div class="br-id"><div class="br-tag" data-text="right.tag"></div><div class="br-name" data-text="right.name"></div></div>
          <div class="br-mono" data-mono="right"></div>
        </div>
      </div>
      <div class="br-foot a-up d4">
        <div class="br-next">ต่อไป · GAME <b data-text="gameNumber"></b> <span class="dim" data-text="boLabel"></span></div>
        <div class="br-clock" data-when-clock>กลับมาในอีก <span class="clock" data-clock></span></div>
      </div>
    </section>

    <!-- ===================== WINNER ===================== -->
    <section class="scene scene-winner" data-scene="winner">
      <div class="wn-rays"></div>
      <div class="wn-body">
        <div class="wn-label a-rise">WINNER</div>
        <div class="wn-mono a-pop d1" data-mono="winner" data-variant="on-color"></div>
        <div class="wn-name a-rise d2" data-text="winner.name"></div>
        <div class="wn-meta a-up d3">
          <span class="wn-th">ผู้ชนะ</span><i class="sep"></i><span data-text="roundName"></span><i class="sep"></i><span class="wn-score" data-text="finalScore"></span>
        </div>
      </div>
      <div class="corner-chip a-drop"><span data-text="eventName"></span></div>
    </section>

    <!-- ===================== STINGER ===================== -->
    <div id="stinger" aria-hidden="true">
      <div class="st-band"><div class="st-mark" data-text="eventName"></div></div>
    </div>

    <div id="conn" class="conn">กำลังเชื่อมต่อ server…</div>
  </div>

  <script src="js/socket.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
