<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROV Control</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:12px; background:#151a26; color:#e8ecf4; font:14px system-ui,'Kanit',sans-serif; }
  h3 { margin:14px 0 6px; font-size:12px; letter-spacing:1px; color:#8d97ad; text-transform:uppercase; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  input[type=text], select { flex:1; min-width:0; background:#0d111b; color:#fff; border:1px solid #2c3447; border-radius:6px; padding:7px 8px; font:inherit; }
  input[type=color] { width:38px; height:34px; border:none; background:none; padding:0; }
  button { background:#2c3447; color:#fff; border:none; border-radius:6px; padding:8px 12px; font:inherit; cursor:pointer; }
  button:hover { background:#3a445c; }
  .scenes button { flex:1; padding:12px 4px; font-weight:700; }
  .scenes button.on { background:#ffd166; color:#111; }
  .team { border-left:5px solid; padding-left:8px; margin-bottom:8px; }
  .big { font-size:26px; font-weight:800; width:40px; text-align:center; }
  .grow { flex:1; }
  .danger { background:#5a2430; }
</style>
</head>
<body>
<h3>ฉาก</h3>
<div class="row scenes">
  <button data-scene="score">สกอร์</button>
  <button data-scene="break">พัก/รอ</button>
  <button data-scene="winner">ผู้ชนะ</button>
  <button data-scene="hidden">ซ่อน</button>
</div>

<h3>ทีม</h3>
<div class="team" id="tA">
  <div class="row"><input type="text" id="nameA"><input type="color" id="colA"></div>
  <div class="row"><button data-d="a,-1">−</button><span class="big" id="scA">0</span><button data-d="a,1">+</button>
    <button class="grow" data-win="a">ประกาศชนะ</button></div>
</div>
<div class="team" id="tB">
  <div class="row"><input type="text" id="nameB"><input type="color" id="colB"></div>
  <div class="row"><button data-d="b,-1">−</button><span class="big" id="scB">0</span><button data-d="b,1">+</button>
    <button class="grow" data-win="b">ประกาศชนะ</button></div>
</div>
<div class="row"><button class="grow" id="swap">สลับฝั่ง</button><button class="grow danger" id="reset">รีเซ็ตคะแนน</button></div>

<h3>แมตช์</h3>
<div class="row"><input type="text" id="title" placeholder="ชื่องาน"></div>
<div class="row"><input type="text" id="round" placeholder="รอบ"></div>
<div class="row">
  <select id="bo"><option value="1">BO1</option><option value="3">BO3</option><option value="5">BO5</option><option value="7">BO7</option></select>
  <span>เกม</span><button data-g="-1">−</button><span class="big" id="game">1</span><button data-g="1">+</button>
</div>

<h3>หน้าพัก</h3>
<div class="row"><input type="text" id="breakTitle"></div>
<div class="row"><input type="text" id="breakSub"></div>
<div class="row">
  <button data-cd="1">1 นาที</button><button data-cd="5">5</button><button data-cd="10">10</button><button data-cd="15">15</button>
  <button data-cd="0" class="danger">ปิดนับ</button>
</div>
<div class="row">
  <button class="grow" data-preset="เริ่มแข่งเร็วๆ นี้|STARTING SOON">รอเริ่ม</button>
  <button class="grow" data-preset="พักระหว่างเกม|BREAK">พัก</button>
  <button class="grow" data-preset="ขอบคุณที่รับชม|THANK YOU">จบงาน</button>
</div>

<script src="shared.js"></script>
<script>
const $ = id => document.getElementById(id);
let S = loadState();

function paint() {
  $('nameA').value = S.a.name; $('colA').value = S.a.color; $('scA').textContent = S.a.score;
  $('nameB').value = S.b.name; $('colB').value = S.b.color; $('scB').textContent = S.b.score;
  $('tA').style.borderColor = S.a.color; $('tB').style.borderColor = S.b.color;
  ['title','round','breakTitle','breakSub'].forEach(k => { if (document.activeElement !== $(k)) $(k).value = S[k]; });
  $('bo').value = S.bo; $('game').textContent = S.game;
  document.querySelectorAll('[data-scene]').forEach(b => b.classList.toggle('on', b.dataset.scene === S.scene));
}
function commit() { saveState(S); paint(); }

document.querySelectorAll('[data-scene]').forEach(b => b.onclick = () => { S.scene = b.dataset.scene; commit(); });
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
  const [t, d] = b.dataset.d.split(',');
  S[t].score = Math.max(0, Math.min(Math.ceil(S.bo / 2), S[t].score + +d));
  S.game = Math.min(S.bo, S.a.score + S.b.score + 1);
  commit();
});
document.querySelectorAll('[data-win]').forEach(b => b.onclick = () => { S.winner = b.dataset.win; S.scene = 'winner'; commit(); });
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.game = Math.max(1, Math.min(S.bo, S.game + +b.dataset.g)); commit(); });
document.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => { const m = +b.dataset.cd; S.countdownEnd = m ? Date.now() + m * 60000 : 0; commit(); });
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  [S.breakTitle, S.breakSub] = b.dataset.preset.split('|'); S.scene = 'break'; commit();
});
$('swap').onclick = () => { [S.a, S.b] = [S.b, S.a]; commit(); };
$('reset').onclick = () => { if (confirm('รีเซ็ตคะแนนเป็น 0:0 ?')) { S.a.score = S.b.score = 0; S.game = 1; commit(); } };
$('bo').onchange = () => { S.bo = +$('bo').value; commit(); };
$('nameA').oninput = () => { S.a.name = $('nameA').value; commit(); };
$('nameB').oninput = () => { S.b.name = $('nameB').value; commit(); };
$('colA').oninput = () => { S.a.color = $('colA').value; commit(); };
$('colB').oninput = () => { S.b.color = $('colB').value; commit(); };
['title','round','breakTitle','breakSub'].forEach(k => $(k).oninput = () => { S[k] = $(k).value; commit(); });

onState(s => { S = s; paint(); });
</script>
</body>
</html>
