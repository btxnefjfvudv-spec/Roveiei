<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROV Sports Day Control</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@300;400;600&family=IBM+Plex+Sans+Thai:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0d; --panel:#131316; --line:#26252a; --gold:#cdb27a; --text:#eeeae2; --mute:#8b867c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px 'Inter','IBM Plex Sans Thai',system-ui,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font:italic 500 28px 'Cormorant Garamond',serif; letter-spacing:1px; }
  header h1 small { font:300 11px 'Inter'; letter-spacing:4px; color:var(--gold); margin-left:14px; }
  header a { color:var(--gold); text-decoration:none; font-size:12px; letter-spacing:2px; border:1px solid var(--gold); padding:8px 14px; border-radius:3px; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:24px; padding:24px 28px; max-width:1500px; margin:auto; }
  .preview { position:relative; aspect-ratio:16/9; border:1px solid var(--line); border-radius:6px; overflow:hidden;
    background:repeating-conic-gradient(#1a1a1d 0 25%,#141416 0 50%) 0 0/24px 24px; }
  .preview iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .hint { color:var(--mute); font-size:12px; margin-top:10px; line-height:1.7; }
  .hint code { color:var(--gold); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 12px; font-size:11px; font-weight:400; letter-spacing:4px; color:var(--gold); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  input[type=text], select { flex:1; min-width:0; background:var(--bg); color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:9px 10px; font:inherit; outline:none; }
  input[type=text]:focus, select:focus { border-color:var(--gold); }
  input.ab { flex:0 0 76px; text-transform:uppercase; letter-spacing:3px; text-align:center; font-weight:600; }
  input[type=color] { width:38px; height:38px; border:1px solid var(--line); border-radius:4px; background:none; padding:2px; cursor:pointer; }
  button { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:9px 12px; font:inherit; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--gold); color:var(--gold); }
  .scenes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .scenes button { padding:14px 4px; font-weight:600; }
  .scenes button.on { background:var(--gold); color:#111; border-color:var(--gold); }
  .team { border-left:2px solid; padding-left:12px; margin-bottom:14px; }
  .score { font:300 28px 'Inter',sans-serif; width:44px; text-align:center; }
  .grow { flex:1; }
  .sq { width:40px; font-size:18px; padding:6px 0; }
  .danger:hover { border-color:#c55; color:#e77; }
  @media (max-width:900px) { main { grid-template-columns:1fr; padding:16px; } header { padding:14px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Sports Day <small>ROV CONTROL</small></h1>
  <a href="overlay.html" target="_blank">OPEN OVERLAY ↗</a>
</header>
<main>
  <section>
    <div class="preview"><iframe src="overlay.html" title="preview"></iframe></div>
    <p class="hint">ตัวอย่างสดของสิ่งที่ขึ้นจอ · ใน OBS เพิ่ม <b>Browser Source</b> ใช้ URL <code>file:///…/overlay.html</code> ขนาด 1920×1080<br>
      ต้องเปิดหน้านี้ใน <b>OBS → Docks → Custom Browser Docks</b> (URL <code>file:///…/index.html</code>) เพื่อให้สั่งกราฟฟิกใน OBS ได้</p>
  </section>

  <aside>
    <div class="card">
      <h3>SCENE</h3>
      <div class="scenes">
        <button data-scene="score">สกอร์</button>
        <button data-scene="break">พัก</button>
        <button data-scene="winner">ผู้ชนะ</button>
        <button data-scene="hidden">ซ่อน</button>
      </div>
    </div>

    <div class="card">
      <h3>TEAMS</h3>
      <div class="team" id="tA">
        <div class="row"><input type="text" id="nameA" placeholder="ชื่อเต็ม"><input type="text" class="ab" id="abA" maxlength="4"><input type="color" id="colA"></div>
        <div class="row"><button class="sq" data-d="a,-1">−</button><span class="score" id="scA">0</span><button class="sq" data-d="a,1">+</button>
          <button class="grow" data-win="a">ประกาศชนะ</button></div>
      </div>
      <div class="team" id="tB">
        <div class="row"><input type="text" id="nameB" placeholder="ชื่อเต็ม"><input type="text" class="ab" id="abB" maxlength="4"><input type="color" id="colB"></div>
        <div class="row"><button class="sq" data-d="b,-1">−</button><span class="score" id="scB">0</span><button class="sq" data-d="b,1">+</button>
          <button class="grow" data-win="b">ประกาศชนะ</button></div>
      </div>
      <div class="row"><button class="grow" id="swap">สลับฝั่ง</button><button class="grow danger" id="reset">รีเซ็ตคะแนน</button></div>
    </div>

    <div class="card">
      <h3>MATCH</h3>
      <div class="row"><input type="text" id="title" placeholder="ชื่องาน"><input type="text" id="round" placeholder="รอบ"></div>
      <div class="row">
        <select id="bo"><option value="1">BO1</option><option value="3">BO3</option><option value="5">BO5</option><option value="7">BO7</option></select>
        <span style="color:var(--mute)">GAME</span><button class="sq" data-g="-1">−</button><span class="score" id="game">1</span><button class="sq" data-g="1">+</button>
      </div>
    </div>

    <div class="card">
      <h3>BREAK SCREEN</h3>
      <div class="row"><input type="text" id="breakTitle"></div>
      <div class="row"><input type="text" id="breakSub"></div>
      <div class="row">
        <button class="grow" data-preset="Starting Soon|การแข่งขันกำลังจะเริ่มขึ้น">รอเริ่ม</button>
        <button class="grow" data-preset="Intermission|พักระหว่างเกม">พัก</button>
        <button class="grow" data-preset="Thank You|ขอบคุณที่รับชม">จบงาน</button>
      </div>
      <div class="row">
        <button class="grow" data-cd="1">1′</button><button class="grow" data-cd="3">3′</button><button class="grow" data-cd="5">5′</button>
        <button class="grow" data-cd="10">10′</button><button class="grow danger" data-cd="0">ปิด</button>
      </div>
    </div>
  </aside>
</main>

<script>
// State shared between index.html (control) and overlay.html (same browser / OBS profile)
const KEY = 'rov-sportday-state-v2';
const DEFAULT_STATE = {
  scene: 'score',            // score | break | winner | hidden
  title: 'SPORTS DAY 2026',
  round: 'ROUND 1',
  bo: 3,
  game: 1,
  a: { name: 'SUKHOTHAI',   abbr: 'SKT', color: '#ec4f93', score: 0 },
  b: { name: 'CHIANG SAEN', abbr: 'CSN', color: '#f5c518', score: 0 },
  breakTitle: 'Starting Soon',
  breakSub: 'การแข่งขันกำลังจะเริ่มขึ้น',
  countdownEnd: 0,
  winner: 'a',
  v: 0
};

const chan = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) return Object.assign({}, DEFAULT_STATE, s, {
      a: Object.assign({}, DEFAULT_STATE.a, s.a),
      b: Object.assign({}, DEFAULT_STATE.b, s.b)
    });
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function saveState(s) {
  s.v = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  if (chan) chan.postMessage(s);
}

function onState(cb) {
  let last = 0;
  const handle = s => { if (s && s.v !== last) { last = s.v; cb(s); } };
  if (chan) chan.onmessage = e => handle(e.data);
  window.addEventListener('storage', e => { if (e.key === KEY) handle(loadState()); });
  setInterval(() => handle(loadState()), 500); // fallback
  handle(loadState());
}
</script>
<script>
const $ = id => document.getElementById(id);
let S = loadState();
const fields = { nameA:['a','name'], abA:['a','abbr'], colA:['a','color'], nameB:['b','name'], abB:['b','abbr'], colB:['b','color'] };

function paint() {
  for (const [id, [t, k]] of Object.entries(fields)) if (document.activeElement !== $(id)) $(id).value = S[t][k];
  ['title','round','breakTitle','breakSub'].forEach(k => { if (document.activeElement !== $(k)) $(k).value = S[k]; });
  $('scA').textContent = S.a.score; $('scB').textContent = S.b.score;
  $('tA').style.borderColor = S.a.color; $('tB').style.borderColor = S.b.color;
  $('bo').value = S.bo; $('game').textContent = S.game;
  document.querySelectorAll('[data-scene]').forEach(b => b.classList.toggle('on', b.dataset.scene === S.scene));
}
function commit() { saveState(S); paint(); }

for (const [id, [t, k]] of Object.entries(fields))
  $(id).oninput = () => { S[t][k] = k === 'abbr' ? $(id).value.toUpperCase() : $(id).value; commit(); };
['title','round','breakTitle','breakSub'].forEach(k => $(k).oninput = () => { S[k] = $(k).value; commit(); });

document.querySelectorAll('[data-scene]').forEach(b => b.onclick = () => { S.scene = b.dataset.scene; commit(); });
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
  const [t, d] = b.dataset.d.split(',');
  S[t].score = Math.max(0, Math.min(Math.ceil(S.bo / 2), S[t].score + +d));
  S.game = Math.min(S.bo, S.a.score + S.b.score + 1);
  commit();
});
document.querySelectorAll('[data-win]').forEach(b => b.onclick = () => { S.winner = b.dataset.win; S.scene = 'winner'; commit(); });
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.game = Math.max(1, Math.min(S.bo, S.game + +b.dataset.g)); commit(); });
document.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => { const m = +b.dataset.cd; S.countdownEnd = m ? Date.now() + m * 60000 : 0; commit(); });
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { [S.breakTitle, S.breakSub] = b.dataset.preset.split('|'); S.scene = 'break'; commit(); });
$('swap').onclick = () => { [S.a, S.b] = [S.b, S.a]; commit(); };
$('reset').onclick = () => { if (confirm('รีเซ็ตคะแนนเป็น 0:0 ?')) { S.a.score = S.b.score = 0; S.game = 1; commit(); } };
$('bo').onchange = () => { S.bo = +$('bo').value; commit(); };

onState(s => { S = s; paint(); });
</script>
</body>
</html>
