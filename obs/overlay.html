<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ROV Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Serif+Thai:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --a:#ec4f93; --b:#f5c518; --w:#ec4f93;
    --navy:#0c0a1e; --navy2:#1b1540; --royal:#2a1f66;
    --g1:#7a5418; --g2:#c9962f; --g3:#f6e3a4; --g4:#fff6d6;
    --metal:linear-gradient(180deg,#fff6d6 0%,#f2d688 22%,#c9962f 48%,#8a6020 52%,#d6aa48 72%,#f8e7ad 100%);
    --edge:linear-gradient(90deg,#6e4c16,#e9c977,#fff3c8,#c9962f,#6e4c16);
    --cinzel:'Cinzel',serif;
    --thai:'Noto Serif Thai',serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:transparent; overflow:hidden; color:#f6efe0; font-family:var(--cinzel); }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  .scene { position:absolute; inset:0; opacity:0; transition:opacity 1s ease; pointer-events:none; }
  .scene.on { opacity:1; }

  /* metallic gold text with sweeping shine */
  .gold { background:var(--metal); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 0 #3a2608) drop-shadow(0 6px 18px rgba(0,0,0,.55)); position:relative; }
  .shine { background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%) , var(--metal);
    background-size:250% 100%, 100% 100%; background-position:150% 0, 0 0;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 5s ease-in-out infinite; }
  @keyframes shine { 0%,55% { background-position:150% 0,0 0 } 100% { background-position:-60% 0,0 0 } }
  .hair { height:2px; background:var(--edge); }

  /* ================= SCOREBOARD ================= */
  .board { position:absolute; top:22px; left:50%; transform:translate(-50%,-170%); transition:transform 1s cubic-bezier(.16,1,.3,1); }
  #score.on .board { transform:translate(-50%,0); }
  .plate { position:relative; display:flex; align-items:center; height:86px; padding:2px;
    background:var(--edge); clip-path:polygon(28px 0,calc(100% - 28px) 0,100% 50%,calc(100% - 28px) 100%,28px 100%,0 50%);
    filter:drop-shadow(0 16px 30px rgba(0,0,0,.6)); }
  .inner { display:flex; align-items:center; height:100%; width:100%;
    background:linear-gradient(180deg,#221a52,#0c0a1e 70%);
    clip-path:polygon(27px 0,calc(100% - 27px) 0,100% 50%,calc(100% - 27px) 100%,27px 100%,0 50%); }
  .side { display:flex; align-items:center; gap:20px; width:300px; height:100%; padding:0 40px; position:relative; }
  .side.a { justify-content:flex-end; }
  .gem { width:16px; height:16px; transform:rotate(45deg); border:2px solid var(--g3);
    box-shadow:0 0 14px currentColor, inset 0 0 6px rgba(255,255,255,.6); }
  .side.a .gem { background:var(--a); color:var(--a); } .side.b .gem { background:var(--b); color:var(--b); }
  .tint { position:absolute; top:0; bottom:0; width:60%; opacity:.28; }
  .side.a .tint { left:0; background:linear-gradient(90deg,var(--a),transparent); }
  .side.b .tint { right:0; background:linear-gradient(270deg,var(--b),transparent); }
  .abbr { font-weight:900; font-size:44px; letter-spacing:6px; position:relative; }
  .pips { display:flex; gap:8px; position:relative; }
  .pip { width:11px; height:11px; transform:rotate(45deg); border:1.5px solid var(--g2); }
  .pip.won { background:var(--metal); border-color:var(--g4); box-shadow:0 0 10px var(--g3); }
  .core { position:relative; width:250px; height:100%; display:flex; align-items:center; justify-content:center; gap:26px; }
  .core::before, .core::after { content:''; position:absolute; top:12px; bottom:12px; width:2px; background:linear-gradient(180deg,transparent,var(--g2),transparent); }
  .core::before { left:0 } .core::after { right:0 }
  .num { font-weight:700; font-size:60px; line-height:1; width:46px; text-align:center; }
  .sep { width:12px; height:12px; transform:rotate(45deg); background:var(--metal); }
  .crest { position:absolute; left:50%; top:96px; transform:translateX(-50%); display:flex; align-items:center; gap:16px; opacity:0; transition:opacity 1s .5s; }
  #score.on .crest { opacity:1; }
  .crest .hair { width:80px; } .crest .hair:last-child { transform:scaleX(-1); }
  .crest .box { padding:6px 22px; background:rgba(12,10,30,.9); border:1px solid rgba(233,201,119,.55); }
  .crest .box span { font-size:15px; letter-spacing:6px; font-weight:700; white-space:nowrap; }
  .flash { animation:flash 1.1s ease; }
  @keyframes flash { 30% { transform:scale(1.35); filter:drop-shadow(0 0 22px #ffe9a8); } }

  /* ================= FULLSCREEN ================= */
  .bg { position:absolute; inset:0; overflow:hidden;
    background:radial-gradient(70% 70% at 50% 45%, var(--navy2), var(--navy) 70%, #050411); }
  .bg .rays { position:absolute; left:50%; top:46%; width:2600px; height:2600px; margin:-1300px 0 0 -1300px;
    background:repeating-conic-gradient(from 0deg, rgba(246,227,164,.06) 0 4deg, transparent 4deg 12deg);
    -webkit-mask:radial-gradient(circle, #000 0, transparent 55%); mask:radial-gradient(circle, #000 0, transparent 55%);
    animation:spin 120s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .bg .glowA, .bg .glowB { position:absolute; width:1100px; height:1100px; border-radius:50%; filter:blur(120px); opacity:.33; }
  .bg .glowA { left:-400px; top:-400px; background:var(--a); }
  .bg .glowB { right:-400px; bottom:-400px; background:var(--b); }
  .bg .pattern { position:absolute; inset:0; opacity:.07;
    background:
      linear-gradient(45deg, transparent 48.5%, var(--g3) 49.5% 50.5%, transparent 51.5%) 0 0/90px 90px,
      linear-gradient(-45deg, transparent 48.5%, var(--g3) 49.5% 50.5%, transparent 51.5%) 0 0/90px 90px;
    -webkit-mask:radial-gradient(circle at 50% 50%, transparent 30%, #000 85%); mask:radial-gradient(circle at 50% 50%, transparent 30%, #000 85%); }
  /* ornate frame */
  .frame { position:absolute; inset:36px; border:2px solid transparent;
    border-image:linear-gradient(135deg,#6e4c16,#f6e3a4,#a87b2a,#fff3c8,#6e4c16) 1; }
  .frame::after { content:''; position:absolute; inset:10px; border:1px solid rgba(233,201,119,.35); }
  .orn { position:absolute; width:34px; height:34px; transform:rotate(45deg); background:var(--metal); box-shadow:0 0 18px rgba(246,227,164,.5); }
  .orn::after { content:''; position:absolute; inset:9px; background:var(--navy); }
  .o1 { left:19px; top:19px } .o2 { right:19px; top:19px } .o3 { left:19px; bottom:19px } .o4 { right:19px; bottom:19px }
  .o5 { left:50%; top:19px; margin-left:-17px } .o6 { left:50%; bottom:19px; margin-left:-17px }

  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .emblem { height:150px; filter:drop-shadow(0 8px 24px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(246,227,164,.25)); }
  .eyebrow { display:flex; align-items:center; gap:24px; margin-top:22px; font-size:22px; letter-spacing:10px; font-weight:700; }
  .eyebrow .hair { width:140px; } .eyebrow .hair:last-child { transform:scaleX(-1); }
  .rise > * { opacity:0; transform:translateY(26px); }
  .scene.on .rise > * { animation:rise 1.2s cubic-bezier(.16,1,.3,1) forwards; }
  .scene.on .rise > *:nth-child(2) { animation-delay:.12s } .scene.on .rise > *:nth-child(3) { animation-delay:.24s }
  .scene.on .rise > *:nth-child(4) { animation-delay:.36s } .scene.on .rise > *:nth-child(5) { animation-delay:.48s }
  .scene.on .rise > *:nth-child(6) { animation-delay:.6s }
  @keyframes rise { to { opacity:1; transform:none; } }

  .btitle { font-weight:900; font-size:132px; line-height:1.05; letter-spacing:6px; margin-top:22px; }
  .bsub { font-family:var(--thai); font-weight:300; font-size:30px; letter-spacing:3px; color:#e9dcc0; margin-top:10px; }
  .count { display:flex; align-items:center; gap:30px; margin-top:34px; }
  .count .d { width:16px; height:16px; transform:rotate(45deg); border:2px solid var(--g2); }
  .count b { font-weight:500; font-size:96px; letter-spacing:8px; font-variant-numeric:tabular-nums; }
  .match { display:flex; align-items:center; gap:40px; margin-top:44px; }
  .chip { position:relative; min-width:440px; padding:16px 40px; font-weight:700; font-size:40px; letter-spacing:8px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25)); border:1.5px solid rgba(233,201,119,.6); }
  .chip::before { content:''; position:absolute; top:-1.5px; bottom:-1.5px; width:8px; }
  .chip.a::before { left:-1.5px; background:var(--a); box-shadow:0 0 22px var(--a); }
  .chip.b::before { right:-1.5px; background:var(--b); box-shadow:0 0 22px var(--b); }
  .vsx { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:62px; }
  .rovlogo { position:absolute; right:90px; bottom:80px; height:120px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.6)); }

  /* winner */
  .wlabel { font-weight:900; font-size:40px; letter-spacing:22px; margin-top:16px; }
  .wname { font-weight:900; font-size:170px; line-height:1.1; letter-spacing:10px; margin:10px 0 4px; }
  .ribbon { position:relative; height:12px; width:900px; margin:6px 0 26px;
    background:linear-gradient(90deg,transparent,var(--w) 20%,var(--w) 80%,transparent); box-shadow:0 0 40px var(--w); }
  .ribbon::after { content:''; position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; transform:rotate(45deg);
    background:var(--metal); box-shadow:0 0 20px #fff1c0; }
  .wscore { display:flex; align-items:center; gap:34px; font-size:30px; font-weight:700; letter-spacing:8px; }
  .wscore b { font-size:70px; font-weight:700; letter-spacing:0; }
  .spark { position:absolute; width:4px; height:4px; transform:rotate(45deg); background:#fff1c0; box-shadow:0 0 10px 3px rgba(246,227,164,.8);
    animation:float linear infinite; opacity:0; }
  @keyframes float { 10% { opacity:1 } 85% { opacity:.9 } to { transform:translateY(-1150px) rotate(405deg); opacity:0; } }
</style>
</head>
<body>
<div id="stage">

  <!-- SCOREBOARD -->
  <section class="scene" id="score">
    <div class="board">
      <div class="plate"><div class="inner">
        <div class="side a"><div class="tint"></div><div class="pips" id="pipsA"></div><div class="abbr gold shine" id="abA"></div><div class="gem"></div></div>
        <div class="core"><span class="num gold" id="scA">0</span><span class="sep"></span><span class="num gold" id="scB">0</span></div>
        <div class="side b"><div class="tint"></div><div class="gem"></div><div class="abbr gold shine" id="abB"></div><div class="pips" id="pipsB"></div></div>
      </div></div>
      <div class="crest"><div class="hair"></div><div class="box"><span class="gold" id="meta"></span></div><div class="hair"></div></div>
    </div>
  </section>

  <!-- BREAK -->
  <section class="scene" id="break">
    <div class="bg"><div class="glowA"></div><div class="glowB"></div><div class="rays"></div><div class="pattern"></div></div>
    <div class="frame"></div>
    <div class="orn o1"></div><div class="orn o2"></div><div class="orn o3"></div><div class="orn o4"></div><div class="orn o5"></div><div class="orn o6"></div>
    <img class="rovlogo" src="assets/rov.png" alt="">
    <div class="center rise">
      <img class="emblem" src="assets/emblem.png" alt="">
      <div class="eyebrow"><div class="hair"></div><span class="gold" id="bEv"></span><div class="hair"></div></div>
      <div class="btitle gold shine" id="bTitle"></div>
      <div class="bsub" id="bSub"></div>
      <div class="count" id="bCount"><span class="d"></span><b class="gold" id="bTime"></b><span class="d"></span></div>
      <div class="match">
        <div class="chip a"><span class="gold" id="mA"></span></div>
        <span class="vsx gold">vs</span>
        <div class="chip b"><span class="gold" id="mB"></span></div>
      </div>
    </div>
  </section>

  <!-- WINNER -->
  <section class="scene" id="winner">
    <div class="bg"><div class="glowA" style="background:var(--w)"></div><div class="glowB" style="background:var(--w)"></div><div class="rays" style="animation-duration:60s"></div><div class="pattern"></div></div>
    <div id="sparks"></div>
    <div class="frame"></div>
    <div class="orn o1"></div><div class="orn o2"></div><div class="orn o3"></div><div class="orn o4"></div><div class="orn o5"></div><div class="orn o6"></div>
    <img class="rovlogo" src="assets/rov.png" alt="">
    <div class="center rise">
      <img class="emblem" src="assets/emblem.png" alt="">
      <div class="wlabel gold">CHAMPION</div>
      <div class="wname gold shine" id="wName"></div>
      <div class="ribbon"></div>
      <div class="wscore"><span class="gold" id="wA"></span><b class="gold" id="wSA"></b><span class="sep"></span><b class="gold" id="wSB"></b><span class="gold" id="wB"></span></div>
      <div class="eyebrow"><div class="hair"></div><span class="gold" id="wEv"></span><div class="hair"></div></div>
    </div>
  </section>
</div>

<script src="shared.js"></script>
<script>
const $ = id => document.getElementById(id);
function fit() { $('stage').style.transform = `scale(${Math.min(innerWidth/1920, innerHeight/1080)})`; }
addEventListener('resize', fit); fit();

function pips(el, score, need) {
  el.innerHTML = '';
  for (let i = 0; i < need; i++) {
    const d = document.createElement('div');
    d.className = 'pip' + (i < score ? ' won' : '');
    el.appendChild(d);
  }
}
function setNum(el, v) {
  if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

let S = null, prevScene = null;
function render(s) {
  S = s;
  const r = document.documentElement.style;
  r.setProperty('--a', s.a.color); r.setProperty('--b', s.b.color); r.setProperty('--w', s[s.winner].color);
  if (s.scene !== prevScene) {
    document.querySelectorAll('.scene').forEach(x => x.classList.toggle('on', x.id === s.scene));
    if (s.scene === 'winner') sparks(); else $('sparks').innerHTML = '';
    prevScene = s.scene;
  }
  const need = Math.ceil(s.bo / 2), ev = `${s.title}  ·  ${s.round}`;
  $('abA').textContent = s.a.abbr; $('abB').textContent = s.b.abbr;
  setNum($('scA'), s.a.score); setNum($('scB'), s.b.score);
  pips($('pipsA'), s.a.score, need); pips($('pipsB'), s.b.score, need);
  $('meta').textContent = `GAME ${s.game}  ·  BEST OF ${s.bo}`;

  $('bEv').textContent = ev; $('bTitle').textContent = s.breakTitle; $('bSub').textContent = s.breakSub;
  $('mA').textContent = s.a.name; $('mB').textContent = s.b.name;

  const w = s[s.winner];
  $('wName').textContent = w.name;
  $('wName').style.fontSize = w.name.length > 10 ? '140px' : '170px';
  $('wA').textContent = s.a.abbr; $('wB').textContent = s.b.abbr;
  $('wSA').textContent = s.a.score; $('wSB').textContent = s.b.score;
  $('wEv').textContent = ev;
}
function sparks() {
  const box = $('sparks'); box.innerHTML = '';
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('div');
    p.className = 'spark';
    p.style.left = Math.random() * 1920 + 'px';
    p.style.top = 1080 + Math.random() * 80 + 'px';
    p.style.animationDuration = 7 + Math.random() * 9 + 's';
    p.style.animationDelay = -Math.random() * 16 + 's';
    const z = 2 + Math.random() * 4; p.style.width = p.style.height = z + 'px';
    box.appendChild(p);
  }
}
setInterval(() => {
  if (!S) return;
  const left = Math.max(0, Math.round((S.countdownEnd - Date.now()) / 1000));
  $('bCount').style.visibility = S.countdownEnd && left > 0 ? 'visible' : 'hidden';
  $('bTime').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
}, 250);

onState(render);
</script>
</body>
</html>
