<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ROV Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@200;300;400;600&family=IBM+Plex+Sans+Thai:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --a:#ec4f93; --b:#f5c518;
    --gold:#cdb27a; --gold-soft:rgba(205,178,122,.35);
    --ink:#0a0a0c; --glass:rgba(12,12,15,.82);
    --serif:'Cormorant Garamond',serif;
    --sans:'Inter','IBM Plex Sans Thai',system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:transparent; overflow:hidden; color:#f4f1ea; font-family:var(--sans); }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  .scene { position:absolute; inset:0; opacity:0; transition:opacity .8s ease; pointer-events:none; }
  .scene.on { opacity:1; }

  /* ===== SCOREBOARD ===== */
  .board { position:absolute; top:28px; left:50%; transform:translate(-50%,-160%);
    transition:transform .9s cubic-bezier(.16,1,.3,1); }
  #score.on .board { transform:translate(-50%,0); }
  .bar { display:flex; align-items:center; height:78px; background:var(--glass);
    backdrop-filter:blur(14px); border:1px solid var(--gold-soft); border-radius:4px;
    box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .side { display:flex; align-items:center; gap:22px; width:270px; height:100%; padding:0 28px; position:relative; }
  .side.a { justify-content:flex-end; }
  .side::before { content:''; position:absolute; top:14px; bottom:14px; width:3px; border-radius:2px; }
  .side.a::before { left:0; background:var(--a); box-shadow:0 0 14px var(--a); }
  .side.b::before { right:0; background:var(--b); box-shadow:0 0 14px var(--b); }
  .abbr { font-family:var(--sans); font-weight:600; font-size:40px; letter-spacing:8px; }
  .side.a .abbr { margin-right:-8px; }
  .pips { display:flex; gap:9px; }
  .pip { width:9px; height:9px; transform:rotate(45deg); border:1px solid var(--gold); }
  .pip.won { background:var(--gold); box-shadow:0 0 10px var(--gold); }
  .core { width:210px; height:100%; display:flex; align-items:center; justify-content:center; gap:22px;
    border-left:1px solid var(--gold-soft); border-right:1px solid var(--gold-soft); }
  .num { font-family:'Inter',sans-serif; font-weight:200; font-size:56px; line-height:1; width:44px; font-variant-numeric:tabular-nums; text-align:center; }
  .dash { width:18px; height:1px; background:var(--gold); }
  .sub { display:flex; justify-content:center; margin-top:10px; opacity:0; transition:opacity .8s .4s; }
  #score.on .sub { opacity:1; }
  .sub span { font-size:13px; letter-spacing:5px; color:var(--gold); padding:6px 20px;
    background:var(--glass); border:1px solid var(--gold-soft); border-radius:3px; }
  .flash { animation:flash 1s ease; }
  @keyframes flash { 30% { color:var(--gold); text-shadow:0 0 24px var(--gold); transform:scale(1.18); } }

  /* ===== FULLSCREEN BACKDROP ===== */
  .bg { position:absolute; inset:0; background:var(--ink); overflow:hidden; }
  .bg::before { content:''; position:absolute; inset:-20%;
    background:
      radial-gradient(40% 50% at 12% 18%, color-mix(in srgb,var(--a) 28%,transparent), transparent 70%),
      radial-gradient(40% 50% at 88% 82%, color-mix(in srgb,var(--b) 24%,transparent), transparent 70%);
    animation:drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translate(3%,-2%) scale(1.05); } }
  .bg::after { content:''; position:absolute; inset:48px; border:1px solid var(--gold-soft); }
  .corner { position:absolute; width:26px; height:26px; border-color:var(--gold); border-style:solid; }
  .c1 { top:40px; left:40px; border-width:1px 0 0 1px; } .c2 { top:40px; right:40px; border-width:1px 1px 0 0; }
  .c3 { bottom:40px; left:40px; border-width:0 0 1px 1px; } .c4 { bottom:40px; right:40px; border-width:0 1px 1px 0; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .eyebrow { display:flex; align-items:center; gap:26px; font-size:18px; letter-spacing:9px; color:var(--gold); font-weight:300; }
  .eyebrow::before, .eyebrow::after { content:''; width:90px; height:1px; background:var(--gold); }
  .rise > * { opacity:0; transform:translateY(24px); }
  .scene.on .rise > * { animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards; }
  .scene.on .rise > *:nth-child(2) { animation-delay:.12s } .scene.on .rise > *:nth-child(3) { animation-delay:.24s }
  .scene.on .rise > *:nth-child(4) { animation-delay:.36s } .scene.on .rise > *:nth-child(5) { animation-delay:.48s }
  @keyframes rise { to { opacity:1; transform:none; } }

  /* break */
  .btitle { font-family:var(--serif); font-weight:500; font-style:italic; font-size:150px; line-height:1.05; margin-top:34px; }
  .bsub { font-family:'IBM Plex Sans Thai',var(--sans); font-weight:200; font-size:30px; letter-spacing:4px; color:#cfc9bd; margin-top:14px; }
  .count { font-family:var(--sans); font-weight:200; font-size:120px; letter-spacing:10px; margin-top:44px; font-variant-numeric:tabular-nums; }
  .match { display:flex; align-items:center; gap:46px; margin-top:56px; font-size:30px; letter-spacing:10px; font-weight:300; }
  .match .t { display:flex; align-items:center; gap:18px; }
  .dot { width:12px; height:12px; border-radius:50%; }
  .match .vs { font-family:var(--serif); font-style:italic; letter-spacing:2px; color:var(--gold); font-size:34px; }

  /* winner */
  .wname { font-family:var(--serif); font-weight:600; font-size:200px; line-height:1.05; letter-spacing:6px; margin:30px 0 8px;
    background:linear-gradient(180deg,#fff 10%,var(--w) 95%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 40px color-mix(in srgb,var(--w) 40%,transparent)); }
  .rule { width:420px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:18px 0 26px; }
  .wscore { display:flex; align-items:center; gap:30px; font-size:24px; letter-spacing:8px; font-weight:300; color:#d9d3c7; }
  .wscore b { font-family:'Inter',sans-serif; font-weight:200; font-size:54px; letter-spacing:0; color:#fff; }
  .spark { position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 8px 2px var(--gold); animation:float linear infinite; opacity:0; }
  @keyframes float { 10% { opacity:.9 } 90% { opacity:.9 } to { transform:translateY(-1100px); opacity:0; } }
</style>
</head>
<body>
<div id="stage">

  <section class="scene" id="score">
    <div class="board">
      <div class="bar">
        <div class="side a"><div class="pips" id="pipsA"></div><div class="abbr" id="abA"></div></div>
        <div class="core"><span class="num" id="scA">0</span><span class="dash"></span><span class="num" id="scB">0</span></div>
        <div class="side b"><div class="abbr" id="abB"></div><div class="pips" id="pipsB"></div></div>
      </div>
      <div class="sub"><span id="meta"></span></div>
    </div>
  </section>

  <section class="scene" id="break">
    <div class="bg"></div>
    <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
    <div class="center rise">
      <div class="eyebrow" id="bEv"></div>
      <div class="btitle" id="bTitle"></div>
      <div class="bsub" id="bSub"></div>
      <div class="count" id="bCount"></div>
      <div class="match">
        <div class="t"><span class="dot" style="background:var(--a)"></span><span id="mA"></span></div>
        <span class="vs">vs</span>
        <div class="t"><span id="mB"></span><span class="dot" style="background:var(--b)"></span></div>
      </div>
    </div>
  </section>

  <section class="scene" id="winner">
    <div class="bg"></div>
    <div id="sparks"></div>
    <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
    <div class="center rise">
      <div class="eyebrow">WINNER</div>
      <div class="wname" id="wName"></div>
      <div class="rule"></div>
      <div class="wscore"><span id="wA"></span><b id="wSA"></b><span style="color:var(--gold)">—</span><b id="wSB"></b><span id="wB"></span></div>
      <div class="eyebrow" style="margin-top:46px;font-size:15px" id="wEv"></div>
    </div>
  </section>
</div>

<script>
// State shared between index.html (control) and overlay.html (same browser / OBS profile)
const KEY = 'rov-sportday-state-v2';
const DEFAULT_STATE = {
  scene: 'score',            // score | break | winner | hidden
  title: 'SPORTS DAY 2026',
  round: 'ROUND 1',
  bo: 3,
  game: 1,
  a: { name: 'SUKHOTHAI',   abbr: 'SKT', color: '#ec4f93', score: 0 },
  b: { name: 'CHIANG SAEN', abbr: 'CSN', color: '#f5c518', score: 0 },
  breakTitle: 'Starting Soon',
  breakSub: 'การแข่งขันกำลังจะเริ่มขึ้น',
  countdownEnd: 0,
  winner: 'a',
  v: 0
};

const chan = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) return Object.assign({}, DEFAULT_STATE, s, {
      a: Object.assign({}, DEFAULT_STATE.a, s.a),
      b: Object.assign({}, DEFAULT_STATE.b, s.b)
    });
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function saveState(s) {
  s.v = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  if (chan) chan.postMessage(s);
}

function onState(cb) {
  let last = 0;
  const handle = s => { if (s && s.v !== last) { last = s.v; cb(s); } };
  if (chan) chan.onmessage = e => handle(e.data);
  window.addEventListener('storage', e => { if (e.key === KEY) handle(loadState()); });
  setInterval(() => handle(loadState()), 500); // fallback
  handle(loadState());
}
</script>
<script>
const $ = id => document.getElementById(id);
function fit() { $('stage').style.transform = `scale(${Math.min(innerWidth/1920, innerHeight/1080)})`; }
addEventListener('resize', fit); fit();

function pips(el, score, need) {
  el.innerHTML = '';
  for (let i = 0; i < need; i++) {
    const d = document.createElement('div');
    d.className = 'pip' + (i < score ? ' won' : '');
    el.appendChild(d);
  }
}
function setNum(el, v) {
  if (el.textContent !== String(v)) {
    el.textContent = v; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
}

let S = null, prevScene = null;
function render(s) {
  S = s;
  const root = document.documentElement.style;
  root.setProperty('--a', s.a.color); root.setProperty('--b', s.b.color);
  root.setProperty('--w', s[s.winner].color);
  if (s.scene !== prevScene) {
    document.querySelectorAll('.scene').forEach(x => x.classList.toggle('on', x.id === s.scene));
    if (s.scene === 'winner') sparks(); else $('sparks').innerHTML = '';
    prevScene = s.scene;
  }
  const need = Math.ceil(s.bo / 2), ev = `${s.title}  ·  ${s.round}`;
  $('abA').textContent = s.a.abbr; $('abB').textContent = s.b.abbr;
  setNum($('scA'), s.a.score); setNum($('scB'), s.b.score);
  pips($('pipsA'), s.a.score, need); pips($('pipsB'), s.b.score, need);
  $('meta').textContent = `GAME ${s.game}  ·  BEST OF ${s.bo}`;

  $('bEv').textContent = ev; $('bTitle').textContent = s.breakTitle; $('bSub').textContent = s.breakSub;
  $('mA').textContent = s.a.name; $('mB').textContent = s.b.name;

  $('wName').textContent = s[s.winner].name;
  $('wA').textContent = s.a.abbr; $('wB').textContent = s.b.abbr;
  $('wSA').textContent = s.a.score; $('wSB').textContent = s.b.score;
  $('wEv').textContent = ev;
}
function sparks() {
  const box = $('sparks'); box.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'spark';
    p.style.left = Math.random() * 1920 + 'px';
    p.style.top = 1080 + Math.random() * 100 + 'px';
    p.style.animationDuration = 8 + Math.random() * 10 + 's';
    p.style.animationDelay = -Math.random() * 18 + 's';
    const sz = 1 + Math.random() * 3; p.style.width = p.style.height = sz + 'px';
    box.appendChild(p);
  }
}
setInterval(() => {
  if (!S) return;
  const left = Math.max(0, Math.round((S.countdownEnd - Date.now()) / 1000)), el = $('bCount');
  el.style.visibility = S.countdownEnd && left > 0 ? 'visible' : 'hidden';
  el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
}, 250);

onState(render);
</script>
</body>
</html>
