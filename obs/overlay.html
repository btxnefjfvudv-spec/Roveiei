<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ROV Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --a:#ec4f93; --b:#f5c518; --w:#ec4f93; --aT:#fff; --bT:#111; --wT:#fff;
    --navy:#0e1433; --navy2:#151c45; --deep:#080b1f; --line:#2a3366;
    --gold:#d9a93e; --white:#ffffff; --mute:#9aa3c7;
    --cond:'Barlow Condensed','IBM Plex Sans Thai',sans-serif;
    --sans:'Barlow','IBM Plex Sans Thai',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:transparent; overflow:hidden; color:var(--white); font-family:var(--sans); }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  .scene { position:absolute; inset:0; visibility:hidden; }
  .scene.on { visibility:visible; }

  /* wipe-in helper */
  .wipe { clip-path:inset(0 100% 0 0); }
  .scene.on .wipe { animation:wipe .55s cubic-bezier(.7,0,.2,1) forwards; }
  .wipe.r { clip-path:inset(0 0 0 100%); }
  .scene.on .wipe.r { animation-name:wipeR; }
  @keyframes wipe { to { clip-path:inset(0 0 0 0); } }
  @keyframes wipeR { to { clip-path:inset(0 0 0 0); } }
  .d1 { animation-delay:.1s !important } .d2 { animation-delay:.2s !important } .d3 { animation-delay:.3s !important }
  .d4 { animation-delay:.4s !important } .d5 { animation-delay:.5s !important } .d6 { animation-delay:.6s !important }

  /* ================= SCOREBOARD ================= */
  .board { position:absolute; top:24px; left:50%; transform:translateX(-50%); display:flex; height:64px; }
  .tm { display:flex; align-items:center; width:200px; padding:0 22px; position:relative; }
  .tm.a { background:var(--a); color:var(--aT); justify-content:flex-end; }
  .tm.b { background:var(--b); color:var(--bT); }
  .abbr { font-family:var(--cond); font-weight:800; font-size:42px; letter-spacing:2px; line-height:1; }
  .pips { position:absolute; bottom:0; display:flex; gap:4px; }
  .tm.a .pips { right:22px; } .tm.b .pips { left:22px; }
  .pip { width:26px; height:5px; background:rgba(0,0,0,.25); }
  .pip.won { background:var(--white); }
  .tm.b .pip.won { background:var(--deep); }
  .sc { width:76px; display:flex; align-items:center; justify-content:center; background:var(--navy);
    font-family:var(--cond); font-weight:700; font-size:50px; line-height:1; }
  .mid { width:116px; background:var(--deep); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    border-left:1px solid var(--line); border-right:1px solid var(--line); }
  .mid .g { font-family:var(--cond); font-weight:700; font-size:22px; letter-spacing:1px; color:var(--gold); line-height:1; }
  .mid .bo { font-size:12px; font-weight:600; letter-spacing:2px; color:var(--mute); }
  .strip { position:absolute; top:88px; left:50%; transform:translateX(-50%); background:var(--navy); height:28px;
    display:flex; align-items:center; gap:10px; padding:0 16px; font-size:13px; font-weight:600; letter-spacing:2.5px; color:var(--mute); white-space:nowrap; }
  .strip i { width:6px; height:6px; background:var(--gold); }
  .bump { animation:bump .5s ease; }
  @keyframes bump { 0% { background:var(--gold); color:var(--deep); } 100% { background:var(--navy); } }

  /* ================= FULLSCREEN BASE ================= */
  .bg { position:absolute; inset:0; background:var(--navy); overflow:hidden; }
  .bg .slab { position:absolute; top:-200px; bottom:-200px; width:520px; background:var(--navy2); transform:skewX(-18deg); }
  .bg .s1 { left:1180px; } .bg .s2 { left:1760px; width:160px; }
  .topbar { position:absolute; left:0; right:0; top:0; height:110px; display:flex; align-items:center; gap:26px; padding:0 90px;
    background:var(--deep); border-bottom:4px solid var(--gold); }
  .topbar img { height:74px; }
  .topbar .ev { font-family:var(--cond); font-weight:700; font-size:34px; letter-spacing:3px; }
  .topbar .rd { font-family:var(--cond); font-weight:600; font-size:28px; letter-spacing:3px; color:var(--gold); margin-left:auto; }
  .rov { position:absolute; right:90px; bottom:60px; height:110px; }

  /* break */
  .bk { position:absolute; left:90px; top:250px; }
  .label { display:inline-block; background:var(--gold); color:var(--deep); font-family:var(--cond); font-weight:700;
    font-size:26px; letter-spacing:4px; padding:6px 16px; }
  .btitle { font-family:var(--cond); font-weight:800; font-style:italic; font-size:190px; line-height:.9; text-transform:uppercase; margin-top:22px; letter-spacing:-1px; padding-right:40px; }
  .bsub { font-family:'IBM Plex Sans Thai',sans-serif; font-weight:400; font-size:34px; color:var(--mute); margin-top:18px; }
  .clock { display:flex; align-items:stretch; margin-top:42px; height:110px; }
  .clock .k { background:var(--deep); display:flex; align-items:center; padding:0 26px; font-family:var(--cond); font-size:24px; font-weight:700; letter-spacing:4px; color:var(--gold); }
  .clock .t { background:var(--white); color:var(--deep); display:flex; align-items:center; padding:0 34px;
    font-family:var(--cond); font-weight:700; font-size:96px; font-variant-numeric:tabular-nums; line-height:1; }
  .card { position:absolute; left:90px; right:90px; bottom:60px; height:150px; display:flex; }
  .card .t { flex:0 0 560px; display:flex; flex-direction:column; justify-content:center; padding:0 40px; }
  .card .t.a { background:var(--a); color:var(--aT); }
  .card .t.b { background:var(--b); color:var(--bT); text-align:right; }
  .card .t small { font-family:var(--cond); font-weight:700; font-size:26px; letter-spacing:4px; opacity:.75; }
  .card .t b { font-family:var(--cond); font-weight:800; font-size:70px; line-height:1; letter-spacing:1px; }
  .card .vs { width:150px; background:var(--deep); display:flex; align-items:center; justify-content:center;
    font-family:var(--cond); font-weight:800; font-style:italic; font-size:60px; color:var(--gold); }
  .card .fill { flex:1; }

  /* winner */
  #winner .bg { background:var(--deep); }
  .wslab { position:absolute; top:0; bottom:0; left:-200px; width:1380px; background:var(--w); transform:skewX(-14deg); transform-origin:top; }
  .wslab2 { position:absolute; top:0; bottom:0; left:1150px; width:60px; background:var(--gold); transform:skewX(-14deg); transform-origin:top; }
  .wk { position:absolute; left:110px; top:330px; color:var(--wT); }
  .wk .label { background:var(--deep); color:var(--gold); }
  .wname { font-family:var(--cond); font-weight:800; font-style:italic; font-size:200px; line-height:.88; margin-top:26px; text-transform:uppercase; letter-spacing:-2px; padding-right:40px; }
  .wsub { font-family:var(--cond); font-weight:700; font-size:40px; letter-spacing:6px; margin-top:22px; opacity:.85; }
  .wbox { position:absolute; right:110px; top:330px; width:520px; }
  .wrow { display:flex; height:96px; margin-bottom:10px; }
  .wrow .n { flex:1; display:flex; align-items:center; padding:0 26px; font-family:var(--cond); font-weight:800; font-size:48px; letter-spacing:2px; }
  .wrow .s { width:110px; display:flex; align-items:center; justify-content:center; background:var(--white); color:var(--deep);
    font-family:var(--cond); font-weight:800; font-size:64px; }
  .wrow.a .n { background:var(--a); color:var(--aT); } .wrow.b .n { background:var(--b); color:var(--bT); }
  .wrow.lose { opacity:.45; }
  .wcap { font-size:16px; font-weight:700; letter-spacing:4px; color:var(--mute); margin-bottom:12px; }
  #winner .emb { position:absolute; right:110px; bottom:70px; height:120px; }
</style>
</head>
<body>
<div id="stage">

  <!-- SCOREBOARD -->
  <section class="scene" id="score">
    <div class="board">
      <div class="tm a wipe r"><div class="abbr" id="abA"></div><div class="pips" id="pipsA"></div></div>
      <div class="sc wipe r d1" id="scA">0</div>
      <div class="mid wipe d2"><span class="g" id="gNo"></span><span class="bo" id="bo"></span></div>
      <div class="sc wipe d1" id="scB">0</div>
      <div class="tm b wipe"><div class="abbr" id="abB"></div><div class="pips" id="pipsB"></div></div>
    </div>
    <div class="strip wipe d4"><i></i><span id="meta"></span></div>
  </section>

  <!-- BREAK -->
  <section class="scene" id="break">
    <div class="bg"><div class="slab s1"></div><div class="slab s2"></div></div>
    <div class="topbar wipe"><img src="assets/emblem.png" alt=""><span class="ev" id="bEv"></span><span class="rd" id="bRd"></span></div>
    <div class="bk">
      <div class="label wipe d1">ROV TOURNAMENT</div>
      <div class="btitle wipe d2" id="bTitle"></div>
      <div class="bsub wipe d3" id="bSub"></div>
      <div class="clock wipe d4" id="bCount"><div class="k">STARTS IN</div><div class="t" id="bTime"></div></div>
    </div>
    <div class="card">
      <div class="t a wipe d5"><small>TEAM</small><b id="mA"></b></div>
      <div class="vs wipe d5">VS</div>
      <div class="t b wipe r d5"><small>TEAM</small><b id="mB"></b></div>
      <div class="fill"></div>
    </div>
    <img class="rov wipe d6" src="assets/rov.png" alt="">
  </section>

  <!-- WINNER -->
  <section class="scene" id="winner">
    <div class="bg"></div>
    <div class="wslab wipe"></div><div class="wslab2 wipe d1"></div>
    <div class="wk">
      <div class="label wipe d2">CHAMPION</div>
      <div class="wname wipe d3" id="wName"></div>
      <div class="wsub wipe d4" id="wEv"></div>
    </div>
    <div class="wbox">
      <div class="wcap wipe d4">FINAL SCORE</div>
      <div class="wrow a wipe d5" id="rowA"><div class="n" id="wA"></div><div class="s" id="wSA"></div></div>
      <div class="wrow b wipe d5" id="rowB"><div class="n" id="wB"></div><div class="s" id="wSB"></div></div>
    </div>
    <img class="emb wipe d6" src="assets/emblem.png" alt="">
  </section>
</div>

<script src="shared.js"></script>
<script>
const $ = id => document.getElementById(id);
function fit() { $('stage').style.transform = `scale(${Math.min(innerWidth/1920, innerHeight/1080)})`; }
addEventListener('resize', fit); fit();

// readable text color on a team color
function ink(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0b0f24' : '#ffffff';
}
function pips(el, score, need) {
  el.innerHTML = '';
  for (let i = 0; i < need; i++) {
    const d = document.createElement('div');
    d.className = 'pip' + (i < score ? ' won' : '');
    el.appendChild(d);
  }
}
function setNum(el, v) {
  if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}

let S = null, prevScene = null;
function render(s) {
  S = s;
  const r = document.documentElement.style, w = s[s.winner];
  r.setProperty('--a', s.a.color); r.setProperty('--aT', ink(s.a.color));
  r.setProperty('--b', s.b.color); r.setProperty('--bT', ink(s.b.color));
  r.setProperty('--w', w.color);   r.setProperty('--wT', ink(w.color));
  if (s.scene !== prevScene) {
    document.querySelectorAll('.scene').forEach(x => x.classList.toggle('on', x.id === s.scene));
    prevScene = s.scene;
  }
  const need = Math.ceil(s.bo / 2);
  $('abA').textContent = s.a.abbr; $('abB').textContent = s.b.abbr;
  setNum($('scA'), s.a.score); setNum($('scB'), s.b.score);
  pips($('pipsA'), s.a.score, need); pips($('pipsB'), s.b.score, need);
  $('gNo').textContent = `GAME ${s.game}`; $('bo').textContent = `BO${s.bo}`;
  $('meta').textContent = `${s.title}  |  ${s.round}`.toUpperCase();

  $('bEv').textContent = s.title; $('bRd').textContent = s.round;
  $('bTitle').textContent = s.breakTitle; $('bSub').textContent = s.breakSub;
  $('mA').textContent = s.a.name; $('mB').textContent = s.b.name;

  $('wName').textContent = w.name;
  $('wName').style.fontSize = w.name.length > 9 ? '160px' : '200px';
  $('wEv').textContent = `${s.title}  ·  ${s.round}`.toUpperCase();
  $('wA').textContent = s.a.name; $('wB').textContent = s.b.name;
  $('wSA').textContent = s.a.score; $('wSB').textContent = s.b.score;
  $('rowA').classList.toggle('lose', s.winner !== 'a'); $('rowB').classList.toggle('lose', s.winner !== 'b');
}
setInterval(() => {
  if (!S) return;
  const left = Math.max(0, Math.round((S.countdownEnd - Date.now()) / 1000));
  $('bCount').style.display = S.countdownEnd && left > 0 ? '' : 'none';
  $('bTime').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
}, 250);

onState(render);
</script>
</body>
</html>
